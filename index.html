<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenova Dev - Raw Code to Loading API</title>
    <style>
        :root {
            --bg-color: #0b0714;
            --panel-bg: #130d22;
            --primary: #9d4edd;
            --primary-glow: rgba(157, 78, 221, 0.4);
            --secondary: #e0aaff;
            --text-color: #e2e8f0;
            --accent: #c77dff;
            --border-color: #241b3a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--secondary);
            text-shadow: 0 0 15px var(--primary-glow);
            letter-spacing: 2px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .card h2 {
            font-size: 1.2rem;
            color: var(--accent);
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: #080510;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--secondary);
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), #7b2cbf);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
            margin-top: 15px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(157, 78, 221, 0.6);
        }

        .output-box {
            background-color: #080510;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #a78bfa;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            margin-top: 8px;
            margin-bottom: 12px;
        }

        .preview-section {
            grid-column: 1 / -1;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #000;
            margin-top: 15px;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>XENOVA DEV</h1>
        <p>Raw Code to Loading API Generator</p>
    </header>

    <div class="container">
        <!-- Input Panel -->
        <div class="card">
            <h2>1. ใส่โค้ดดิบของคุณ</h2>
            <textarea id="rawCode" placeholder="พิมพ์หรือวางโค้ด HTML/JS ดิบๆ ตรงนี้..."></textarea>
            <button onclick="generateAPI()">สร้างลิงก์ API โหลดดิ้ง</button>
        </div>

        <!-- API Result Panel -->
        <div class="card">
            <h2>2. ผลลัพธ์ API</h2>
            <p style="font-size: 0.85rem; color: #94a3b8;">API Endpoint ลิงก์ย่อ:</p>
            <div class="output-box" id="apiUrlOutput">ยังไม่ได้สร้าง...</div>
            <p style="font-size: 0.85rem; color: #94a3b8;">โค้ดสคริปต์สำหรับนำไปใช้:</p>
            <div class="output-box" id="minifiedOutput">-</div>
        </div>

        <!-- Live Preview Panel -->
        <div class="preview-section">
            <h2>3. ตัวอย่างหน้าจอโหลดดิ้ง (Live Preview)</h2>
            <p style="font-size: 0.85rem; color: #94a3b8;">กดปุ่มด้านล่างเพื่อจำลองหน้าโหลดดิ้งก่อนรันโค้ดจริง</p>
            <button onclick="runPreview()" style="max-width: 250px; margin: 15px auto 0 auto; display: block;">ทดสอบรันหน้าเว็บ</button>
            <iframe id="previewFrame"></iframe>
        </div>
    </div>

    <footer>
        &copy; 2026 Xenova Dev. All rights reserved.
    </footer>

    <script>
        function generateAPI() {
            const code = document.getElementById('rawCode').value;
            if (!code.trim()) {
                alert('ใส่วิชาหรือโค้ดมาก่อนไอ้น้อง!');
                return;
            }

            const randomId = Math.random().toString(36).substring(2, 8);
            const mockApiUrl = `https://xenova.dev/load/${randomId}`;
            
            document.getElementById('apiUrlOutput').innerText = mockApiUrl;
            document.getElementById('minifiedOutput').innerText = `<script src="${mockApiUrl}"><\/script>`;
        }

        function runPreview() {
            const code = document.getElementById('rawCode').value;
            if (!code.trim()) {
                alert('ใส่โค้ดก่อนกดเทส!');
                return;
            }

            const frame = document.getElementById('previewFrame');
            const doc = frame.contentDocument || frame.contentWindow.document;

            doc.open();
            doc.write(`
                <html>
                <head>
                    <style>
                        body { background: #0b0714; color: #e2e8f0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; overflow: hidden; margin: 0; }
                        .spinner { width: 50px; height: 50px; border: 4px solid rgba(157,78,221,0.2); border-top: 4px solid #9d4edd; border-radius: 50%; animation: spin 0.8s linear infinite; }
                        h3 { margin-top: 20px; color: #e0aaff; letter-spacing: 2px; font-size: 1.1rem; }
                        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                    </style>
                </head>
                <body>
                    <div class="spinner"></div>
                    <h3 id="status">XENOVA LOADING...</h3>
                    <script>
                        let texts = ["กำลังโหลดทรัพยากร...", "ถอดรหัสระบบ...", "กำลังเตรียมรันโค้ด..."];
                        let i = 0;
                        setInterval(() => {
                            i = (i + 1) % texts.length;
                            const el = document.getElementById('status');
                            if(el) el.innerText = texts[i];
                        }, 700);

                        setTimeout(() => {
                            document.body.innerHTML = \`${code.replace(/`/g, '\\`')}\`;
                        }, 2200);
                    <\/script>
                </body>
                </html>
            `);
            doc.close();
        }
    </script>
</body>
</html>
